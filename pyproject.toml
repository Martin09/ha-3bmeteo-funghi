[project]
name = "ha-3bmeteo-funghi"
version = "0.1.1"
description = "Home Assistant integration for 3BMeteo mushroom forecasts"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
browser = [
    "playwright>=1.62.0",
]
dev = [
    "beautifulsoup4==4.14.3",
    "prek",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--disable-socket", "--allow-unix-socket"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/3bmeteo_funghi"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
