name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group browser
      - run: uv run --group browser playwright install --with-deps chromium
      - run: uv run --group browser pytest tests/ --cov --cov-report=term-missing
      - name: Generate coverage badge data
        run: |
          pct=$(uv run coverage report --format=total)
          if [ "$pct" -ge 90 ]; then color=brightgreen; elif [ "$pct" -ge 75 ]; then color=green; elif [ "$pct" -ge 60 ]; then color=yellow; else color=red; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage-badge.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-badge
          path: coverage-badge.json
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run prek run --all-files
  coverage-badge:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-badge
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git switch badges 2>/dev/null || git switch --orphan badges
          mkdir -p .badge && mv coverage-badge.json .badge/coverage.json
          git add .badge/coverage.json
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push origin badges
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
